[workspace]
resolver = "2"
members = [
    "crates/gfs-proto",
    "crates/gfs-master",
    "crates/gfs-chunkserver",
    "crates/gfs-client",
    "crates/gfs-fuse",
    "crates/gfs-cli",
    "tests/chaos",
    "tests/bench",
]

[workspace.dependencies]
# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# gRPC & Protobuf
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "channel", "router", "server"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Kubernetes Coordination & Lease
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }

# Storage, Filesystem & Hashing
memmap2 = "0.9"
crc32fast = "1.4"
fuser = { version = "0.15", default-features = false }

# Data Structures & Concurrency
bytes = "1.9"
dashmap = "6.1"
parking_lot = "0.12"
uuid = { version = "1.12", features = ["v4", "serde"] }
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
bincode = "1.3"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Testing & Utilities
tempfile = "3.16"

# Internal Workspace Crates
gfs-proto = { path = "crates/gfs-proto" }
gfs-client = { path = "crates/gfs-client" }
gfs-master = { path = "crates/gfs-master" }
gfs-chunkserver = { path = "crates/gfs-chunkserver" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
