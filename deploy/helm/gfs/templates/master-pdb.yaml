{{- if .Values.master.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gfs.fullname" . }}-master-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gfs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.master.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "gfs.masterSelectorLabels" . | nindent 6 }}
{{- end }}
