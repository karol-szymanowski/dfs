apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gfs-chunkserver
  namespace: default
spec:
  selector:
    matchLabels:
      app: gfs-chunkserver
  template:
    metadata:
      labels:
        app: gfs-chunkserver
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: chunkserver
          image: localhost:5000/gfs-chunkserver:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GFS_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GFS_LISTEN_ADDR
              value: "0.0.0.0:50052"
            - name: GFS_MASTER_ADDR
              value: "http://gfs-master.default.svc.cluster.local:50051"
            - name: GFS_STORAGE_DIR
              value: "/mnt/gfs-storage"
          envFrom:
            - configMapRef:
                name: gfs-config
          ports:
            - containerPort: 50052
              name: grpc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: host-storage
              mountPath: /mnt/gfs-storage
      volumes:
        - name: host-storage
          hostPath:
            path: /mnt/gfs-storage
            type: Directory
