apiVersion: apps/v1
kind: Deployment
metadata:
  name: gfs-master
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gfs-master
  template:
    metadata:
      labels:
        app: gfs-master
    spec:
      serviceAccountName: gfs-master-sa
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - gfs-master
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: master
          image: localhost:5000/gfs-master:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GFS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GFS_LISTEN_ADDR
              value: "0.0.0.0:50051"
            - name: GFS_OPLOG_PATH
              value: "/data/oplog.bin"
          envFrom:
            - configMapRef:
                name: gfs-config
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: metadata-storage
              mountPath: /data
      volumes:
        - name: metadata-storage
          emptyDir: {}
